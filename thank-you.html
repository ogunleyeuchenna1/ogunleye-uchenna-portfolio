<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#100d25">
    <meta name="description" content="Your message has been sent to Ogunleye Uchenna.">
    <title>Message sent — Ogunleye Uchenna</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: dark;
        font-family: "DM Sans", Arial, sans-serif;
        color: #f7f5ff;
        background: #100d25;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(ellipse at 50% 20%, rgba(87, 52, 173, .2), transparent 34rem), #100d25;
      }

      main {
        width: min(100%, 560px);
        padding: clamp(32px, 8vw, 64px);
        border: 1px solid rgba(209, 199, 255, .13);
        border-radius: 18px;
        background: rgba(26, 22, 55, .88);
        text-align: center;
      }

      .icon {
        width: 58px;
        height: 58px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(167, 228, 196, .35);
        border-radius: 50%;
        color: #a7e4c4;
      }

      .icon svg { width: 28px; height: 28px; }

      h1 {
        margin: 0 0 14px;
        font-family: "Space Grotesk", "DM Sans", sans-serif;
        font-size: clamp(30px, 7vw, 42px);
        letter-spacing: -.05em;
      }

      p {
        margin: 0 0 30px;
        color: #aaa5c1;
        line-height: 1.7;
      }

      a {
        min-height: 46px;
        padding: 0 21px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        border-radius: 8px;
        background: linear-gradient(110deg, #8758ee, #a06ef8);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
      }

      a:hover { filter: brightness(1.1); }
      a:focus-visible { outline: 2px solid #b59aff; outline-offset: 4px; }
      .link-icon { width: 16px; height: 16px; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" focusable="false">
          <path d="m5 12 4.5 4.5L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Thank you!</h1>
      <p>Your message has been sent. I appreciate you getting in touch and will get back to you soon.</p>
      <a href="index.html">Back to the homepage
        <svg class="link-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
          <path d="M7 17 17 7M7 7h10v10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </main>
  </body>
</html>
